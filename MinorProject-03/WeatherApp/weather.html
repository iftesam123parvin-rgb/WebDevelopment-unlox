<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <nav class="top-nav"><a href="../index.html">← Home</a><a href="../movies/index.html">Movie Search</a></nav>
 
    <h1>⛅ Weather App</h1>
    <p class="subtitle">Get current weather for any city in the world.</p>
 
    <form id="search-form" class="search-form" novalidate>
      <input id="city-input" type="text" placeholder="Enter a city, e.g. Bengaluru" aria-label="City name" autocomplete="off" />
      <button id="search-btn" class="btn" type="submit">Search</button>
    </form>
 
    <div id="recent" class="recent"></div>
 
    <section id="output" aria-live="polite">
      <p class="message">Search for a city to see its weather.</p>
    </section>
  </main>
 
  <script type="module" src="js/app.js"></script>
</body>
</html>
