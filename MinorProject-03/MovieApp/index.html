<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Search App</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <nav class="top-nav"><a href="../index.html">← Home</a><a href="../weather/index.html">Weather</a></nav>
 
    <h1>🎬 Movie Search</h1>
    <p class="subtitle">Search titles and see posters, ratings and release info.</p>
 
    <form id="search-form" class="search-form" novalidate>
      <input id="search-input" type="text" placeholder="Search a title, e.g. Sherlock" aria-label="Title" autocomplete="off" />
      <select id="sort-select" aria-label="Sort results">
        <option value="relevance">Best match</option>
        <option value="rating">Highest rated</option>
        <option value="newest">Newest first</option>
      </select>
      <button id="search-btn" class="btn" type="submit">Search</button>
    </form>
 
    <section id="status" aria-live="polite">
      <p class="message">Type a title and press Search.</p>
    </section>
 
    <section id="results" class="results-grid"></section>
  </main>
 
  <!-- Details modal -->
  <dialog id="details-modal" class="modal">
    <button class="modal-close" type="button" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </dialog>
 
  <script type="module" src="js/app.js"></script>
</body>
</html>
